name: Intel Mac RDKit wheel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    # Explicit Intel host; macos-13 is retired. Never use macos-latest (Apple silicon).
    runs-on: macos-15-intel
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONHASHSEED: '0'
      SOURCE_DATE_EPOCH: '1788220800'
      RDKIT_SOURCE_TAG: Release_2026_03_5
      # SHA-256 of the official GitHub tarball for this tag, checked against a fresh download.
      # fetch.mjs checks it before using the source.
      RDKIT_SOURCE_SHA256: 336b3ffd9b691e4bfcdf97d361c01e553de34d2ca85c64a941473e9e2f8b707e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify host and fetch checksummed inputs
        run: |
          test "$(uname -m)" = x86_64
          echo "WORK=$RUNNER_TEMP/rdkit-intel" >> "$GITHUB_ENV"
          node scripts/rdkit-intel-wheel/fetch.mjs "$RUNNER_TEMP/rdkit-intel"
          xcodebuild -version
          xcrun clang --version

      - name: Identify runner image for build caches
        id: cache-image
        run: |
          echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Hash inputs for each cached build stage
        id: cache-inputs
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          const inputs = JSON.parse(readFileSync('scripts/rdkit-intel-wheel/inputs.json', 'utf8'));
          const stages = {
            tools: {
              sources: inputs.sources.filter(({ name }) => ['python', 'cmake'].includes(name)),
              // fetch.mjs puts all pinned wheels in tools.txt for the tools venv.
              wheels: inputs.wheels,
            },
            dependencies: {
              sources: inputs.sources.filter(({ name }) => ['boost', 'inchi', 'eigen'].includes(name)),
            },
          };
          for (const [stage, pins] of Object.entries(stages)) {
            const hash = createHash('sha256').update(JSON.stringify(pins)).digest('hex');
            appendFileSync(process.env.GITHUB_OUTPUT, `${stage}=${hash}\n`);
          }
          JS

      # Hash only each stage's build/verification scripts and relevant input pins.
      # Look up first: a prefix match must never be restored or used as a build input.
      - name: Look up exact tool build cache
        id: tools-lookup
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ env.WORK }}/python
            ${{ env.WORK }}/tools
            ${{ env.WORK }}/cmake
          key: rdkit-intel-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-image.outputs.os }}-${{ steps.cache-image.outputs.version }}-target-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('scripts/rdkit-intel-wheel/build-tools.sh', 'scripts/rdkit-intel-wheel/check-build.sh') }}-${{ steps.cache-inputs.outputs.tools }}-v1
          lookup-only: true

      - name: Restore exact tool build cache
        id: tools-cache
        if: steps.tools-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ env.WORK }}/python
            ${{ env.WORK }}/tools
            ${{ env.WORK }}/cmake
          key: ${{ steps.tools-lookup.outputs.cache-primary-key }}
          fail-on-cache-miss: true

      - name: Build pinned CPython 3.12.15 and CMake 4.4.4
        if: steps.tools-lookup.outputs.cache-hit != 'true'
        shell: bash --noprofile --norc scripts/rdkit-intel-wheel/offline-shell.sh {0}
        run: |
          bash scripts/rdkit-intel-wheel/build-tools.sh

      - name: Check tool build and expose tools on PATH
        shell: bash --noprofile --norc scripts/rdkit-intel-wheel/offline-shell.sh {0}
        env:
          LOOKUP_HIT: ${{ steps.tools-lookup.outputs.cache-hit }}
          RESTORE_HIT: ${{ steps.tools-cache.outputs.cache-hit }}
        run: |
          # Fail closed if an exact entry disappears between lookup and restore.
          if [[ "$LOOKUP_HIT" == true ]]; then test "$RESTORE_HIT" = true; fi
          bash scripts/rdkit-intel-wheel/check-build.sh tools
          echo "$WORK/tools/bin" >> "$GITHUB_PATH"
          echo "$WORK/cmake/bin" >> "$GITHUB_PATH"

      - name: Save finished tool build
        if: steps.tools-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ env.WORK }}/python
            ${{ env.WORK }}/tools
            ${{ env.WORK }}/cmake
          key: ${{ steps.tools-lookup.outputs.cache-primary-key }}

      - name: Look up exact dependency build cache
        id: dependencies-lookup
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.WORK }}/prefix
          key: rdkit-intel-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-image.outputs.os }}-${{ steps.cache-image.outputs.version }}-target-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('scripts/rdkit-intel-wheel/build-deps.sh', 'scripts/rdkit-intel-wheel/check-build.sh') }}-${{ steps.cache-inputs.outputs.dependencies }}-${{ steps.tools-lookup.outputs.cache-primary-key }}-v1
          lookup-only: true

      - name: Restore exact dependency build cache
        id: dependencies-cache
        if: steps.dependencies-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.WORK }}/prefix
          key: ${{ steps.dependencies-lookup.outputs.cache-primary-key }}
          fail-on-cache-miss: true

      - name: Build Boost 1.87.0, InChI 1.07.5 and stage Eigen
        if: steps.dependencies-lookup.outputs.cache-hit != 'true'
        shell: bash --noprofile --norc scripts/rdkit-intel-wheel/offline-shell.sh {0}
        run: |
          bash scripts/rdkit-intel-wheel/build-deps.sh

      - name: Check dependency build
        shell: bash --noprofile --norc scripts/rdkit-intel-wheel/offline-shell.sh {0}
        env:
          LOOKUP_HIT: ${{ steps.dependencies-lookup.outputs.cache-hit }}
          RESTORE_HIT: ${{ steps.dependencies-cache.outputs.cache-hit }}
        run: |
          if [[ "$LOOKUP_HIT" == true ]]; then test "$RESTORE_HIT" = true; fi
          bash scripts/rdkit-intel-wheel/check-build.sh dependencies

      # Save the complete dependency prefix before the smoke test moves it.
      - name: Save finished dependency build
        if: steps.dependencies-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.WORK }}/prefix
          key: ${{ steps.dependencies-lookup.outputs.cache-primary-key }}

      - name: Build RDKit from the official source tag
        shell: bash --noprofile --norc scripts/rdkit-intel-wheel/offline-shell.sh {0}
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          # Required FetchContent sources are staged by fetch.mjs; optional download paths are off.
          cmake -S "$WORK/src/rdkit" -B "$WORK/build-rdkit" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="$WORK/stage" -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$WORK/prefix" -DCMAKE_IGNORE_PREFIX_PATH=/usr/local/opt \
            -DCMAKE_INSTALL_RPATH="$WORK/stage/lib;$WORK/prefix/lib" \
            -DCMAKE_CXX_FLAGS=-DEIGEN_MPL2_ONLY -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DFETCHCONTENT_SOURCE_DIR_CATCH2="$WORK/src/catch2" \
            -DFETCHCONTENT_SOURCE_DIR_BETTER_ENUMS="$WORK/src/better_enums" \
            -DCMAKE_DISABLE_FIND_PACKAGE_Catch2=ON -DBUILD_TESTING=OFF \
            -DCMAKE_PROJECT_Catch2_INCLUDE="$GITHUB_WORKSPACE/scripts/rdkit-intel-wheel/catch2-exclude.cmake" \
            -DCATCH_BUILD_TESTING=OFF -DCATCH_BUILD_EXAMPLES=OFF -DCATCH_BUILD_EXTRA_TESTS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_TBB=ON \
            -DPython3_EXECUTABLE="$WORK/tools/bin/python3.12" \
            -DBoost_DIR="$WORK/prefix/lib/cmake/Boost-1.87.0" \
            -DEIGEN3_INCLUDE_DIR="$WORK/prefix/include/eigen3" \
            -DINCHI_INCLUDE_DIR="$WORK/prefix/include/inchi" \
            -DINCHI_LIBRARY="$WORK/prefix/lib/libinchi.dylib" \
            -DINCHI_LIBRARIES="$WORK/prefix/lib/libinchi.dylib" \
            -DRDK_INSTALL_INTREE=OFF -DRDK_INSTALL_STATIC_LIBS=OFF \
            -DPYTHON_INSTDIR="$WORK/stage/python" \
            -DRDK_BUILD_PYTHON_WRAPPERS=ON -DRDK_BUILD_CPP_TESTS=OFF \
            -DRDK_BUILD_SWIG_WRAPPERS=OFF -DRDK_BUILD_PGSQL=OFF -DRDK_BUILD_CONTRIB=OFF \
            -DRDK_TEST_MMFF_COMPLIANCE=OFF -DRDK_BUILD_DESCRIPTORS3D=OFF \
            -DRDK_BUILD_INCHI_SUPPORT=ON -DRDK_BUILD_THREADSAFE_SSS=ON \
            -DRDK_BUILD_PUBCHEMSHAPE_SUPPORT=OFF -DRDK_BUILD_CHEMDRAW_SUPPORT=OFF \
            -DRDK_USE_URF=OFF -DRDK_BUILD_COMPRESSED_SUPPLIERS=OFF \
            -DRDK_BUILD_AVALON_SUPPORT=OFF -DRDK_BUILD_COORDGEN_SUPPORT=OFF \
            -DRDK_BUILD_MAEPARSER_SUPPORT=OFF -DRDK_BUILD_CAIRO_SUPPORT=OFF \
            -DRDK_BUILD_FREETYPE_SUPPORT=OFF -DRDK_BUILD_QT_SUPPORT=OFF \
            -DRDK_INSTALL_COMIC_FONTS=OFF -DRDK_BUILD_FREESASA_SUPPORT=OFF \
            -DRDK_BUILD_YAEHMOP_SUPPORT=OFF -DRDK_BUILD_XYZ2MOL_SUPPORT=OFF
          cmake --build "$WORK/build-rdkit" --parallel 3
          cmake --install "$WORK/build-rdkit"
          node scripts/rdkit-intel-wheel/package.mjs
          mkdir -p "$WORK/raw"
          python3.12 -m wheel pack "$WORK/wheel" --dest-dir "$WORK/raw"

      - name: Bundle dylibs and audit the final wheel
        shell: bash --noprofile --norc scripts/rdkit-intel-wheel/offline-shell.sh {0}
        run: |
          DYLD_LIBRARY_PATH="$WORK/stage/lib:$WORK/prefix/lib" \
            delocate-wheel --require-archs x86_64 --wheel-dir "$WORK/wheelhouse" "$WORK/raw/"*.whl
          node scripts/rdkit-intel-wheel/audit.mjs

      - name: Install with the repository's smoke pins and run smoke tests
        shell: bash --noprofile --norc scripts/rdkit-intel-wheel/offline-shell.sh {0}
        run: |
          python3.12 -m venv --copies "$WORK/smoke"
          "$WORK/smoke/bin/python3.12" -m pip install --no-index --require-hashes \
            --only-binary=:all: --find-links="$WORK/downloads" --find-links="$WORK/wheelhouse" \
            -r "$WORK/smoke.txt"
          # Exercise relocation and prevent accidental loading from the build/install prefixes.
          mv "$WORK/smoke" "$WORK/smoke-moved"
          mv "$WORK/stage" "$WORK/stage-hidden"
          mv "$WORK/prefix" "$WORK/prefix-hidden"
          cd "$RUNNER_TEMP"
          env -u RDBASE -u PYTHONPATH -u DYLD_LIBRARY_PATH "$WORK/smoke-moved/bin/python3.12" -I - <<'PY'
          import rdkit
          import numpy
          from pathlib import Path
          from rdkit import Chem, RDConfig
          from rdkit.Chem import inchi
          assert rdkit.__version__ == '2026.03.5', rdkit.__version__
          assert numpy.__version__ == '2.5.4', numpy.__version__
          assert Path(RDConfig.RDDataDir, 'BaseFeatures.fdef').is_file()
          for smiles, canonical in [
              ('OCC', 'CCO'),
              ('C(C(=O)O)N', 'NCC(=O)O'),
              ('F[C@](Cl)(Br)I', 'F[C@](Cl)(Br)I'),
          ]:
              mol = Chem.MolFromSmiles(smiles)
              assert mol is not None, smiles
              actual = Chem.MolToSmiles(mol, canonical=True, isomericSmiles=True)
              assert actual == canonical, (smiles, actual, canonical)
              assert Chem.MolToSmiles(Chem.MolFromSmiles(actual)) == actual
              assert inchi.INCHI_AVAILABLE
              assert inchi.MolToInchi(mol).startswith('InChI=1S/')
              print(smiles, actual)
          print('RDKit Intel wheel smoke test passed', rdkit.__version__)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rdkit-2026.3.5-cp312-macosx_11_0_x86_64
          path: |
            ${{ runner.temp }}/rdkit-intel/wheelhouse/*.whl
            ${{ runner.temp }}/rdkit-intel/wheelhouse/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
